name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run flake8
        run: flake8 --max-line-length=120 backend/src/

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        run: pytest backend/tests/ -v

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Build backend image
        run: docker build -t product-dashboard-backend:ci ./backend/

      - name: Build frontend image
        run: docker build -t product-dashboard-frontend:ci ./frontend/

      - name: Verify images
        run: docker images | grep product-dashboard

      - name: Step Summary
        run: |
          echo "## CI Build Results" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: passed" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: passed" >> $GITHUB_STEP_SUMMARY
          echo "- Backend image: built" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend image: built" >> $GITHUB_STEP_SUMMARY